<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <script>
      // Theme before first paint (no flash): ?theme=amber|violet|mint, else the saved choice.
      (function () {
        var bgs = { amber: '#08080a', violet: '#07060d', mint: '#060909' };
        var t = null;
        try {
          t = new URLSearchParams(location.search).get('theme');
          if (!bgs[t]) t = localStorage.getItem('theme');
        } catch (e) {}
        if (!bgs[t]) t = 'amber';
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem('theme', t); } catch (e) {}
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bgs[t]);
      })();
    </script>
    <title>Nishant Dahiya — Real-time AI systems</title>
    <meta
      name="description"
      content="Nishant Dahiya builds real-time AI systems for finance: voice agents, fraud shields and streaming telemetry. Amazon AI for Bharat Grand Finalist (Top 6 of 95,000+). B.Tech CS & FinTech, MIT Manipal."
    />
    <meta property="og:title" content="Nishant Dahiya — Real-time AI systems" />
